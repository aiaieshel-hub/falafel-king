<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>מלך הפלאפל</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#172c29;
    font-family: "Heebo","Segoe UI",Arial,sans-serif; touch-action:none;
    user-select:none; -webkit-user-select:none; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; border-radius:12px; box-shadow:0 12px 60px rgba(0,0,0,.55); }
  #muteBtn { position:absolute; bottom:18px; left:max(14px, env(safe-area-inset-left)); z-index:6; width:46px; height:46px;
    border-radius:14px; background:#203d36; border:2px solid #e7c37b;
    color:#fff; font-size:20px; cursor:pointer; box-shadow:0 5px 14px #11271d77; }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<button id="muteBtn" title="השתקה">🔊</button>
<script>
"use strict";
/* ================= מלך הפלאפל - משחק דוכן אידל ================= */
const W = 760, H = 1240;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let scale = 1, offX = 0, offY = 0, dpr = 1;

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const ww = window.innerWidth, wh = window.innerHeight;
  scale = Math.min(ww / W, wh / H);
  cv.style.width  = (W * scale) + 'px';
  cv.style.height = (H * scale) + 'px';
  cv.width  = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  offX = 0; offY = 0;
}
window.addEventListener('resize', resize);
resize();

/* ---------------- צלילים (WebAudio קטן) ---------------- */
let AC = null, muted = false, soundUnlocked = false;
['pointerdown','touchstart','keydown'].forEach(type => window.addEventListener(type, () => { soundUnlocked = true; }, {once:true}));
function beep(freq, dur, type, vol){
  if (muted || !soundUnlocked) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .12, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + (dur || .08));
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + (dur || .08));
  } catch(e){}
}
const sndPick  = () => beep(520, .06, 'triangle', .07);
const sndDrop  = () => beep(300, .07, 'triangle', .08);
const sndCash  = () => { beep(880, .07, 'square', .06); setTimeout(()=>beep(1320,.09,'square',.06), 60); };
const sndBuy   = () => { beep(660, .09, 'sine', .1); setTimeout(()=>beep(990,.12,'sine',.1), 90); };
const sndSell  = () => beep(740, .08, 'triangle', .08);
document.getElementById('muteBtn').addEventListener('click', function(){
  muted = !muted; this.textContent = muted ? '🔇' : '🔊';
});

/* ---------------- מצב המשחק ---------------- */
const S = {
  money: 0,
  price: 5,
  capacity: 8,
  processTime: 1.2,
  t: 0, heat: 0, heatRate: .10, cooldown: 0,
  upgradesBought: 0,
  earned: 0, stage: 1, missed: 0, served: 0, bonus: 0, notice: '', noticeT: 0,
};
const player = {
  x: 380, y: 595, vx: 0, vy: 0, speed: 265,
  carrying: null,   // 'pea' | 'falafel'
  carryN: 0,
  face: 1, bob: 0, moving: false,
};
const field = { x: 55, y: 150, w: 265, h: 360, peas: 40, maxPeas: 40, regrow: 0 };
const machine = { x: 470, y: 150, w: 235, h: 200, input: 0, output: 0, prog: 0,
  inPad:  { x: 585, y: 405, r: 62 },
  outPad: { x: 585, y: 505, r: 62 } };
const stall = { x: 190, y: 860, w: 380, h: 90, stock: 0, moneyPile: 0,
  dropPad:  { x: 132, y: 985, r: 56 },
  moneyPad: { x: 650, y: 897, r: 52 } };
const queueSlots = [];
for (let i = 0; i < 6; i++) queueSlots.push({ x: 640 - i * 92, y: 1010 });

const upgrades = [
  { key:'cap',   name:'קיבולת',    icon:'🎒', x: 120, y: 700, r: 58, level: 0,
    cost: l => 40 + l * 60,
    desc: l => 'יותר סחורה · הליכה איטית יותר',
    apply(){ S.capacity += 4; player.speed = Math.max(175, player.speed - 13); } },
  { key:'price', name:'מחיר',      icon:'🏷️', x: 380, y: 680, r: 58, level: 0,
    cost: l => 50 + l * 75,
    desc: l => 'רווח גבוה · סבלנות נמוכה',
    apply(){ S.price += 2; } },
  { key:'speed', name:'טיגון מהיר', icon:'🔥', x: 640, y: 700, r: 58, level: 0,
    cost: l => 60 + l * 90,
    desc: l => 'מהיר · הפסקות קירור',
    apply(){ S.processTime = Math.max(.42, S.processTime * .78); S.heatRate += .04; } },
];
upgrades.forEach(u => { u.holdT = 0; u.armed = true; });

const customers = [];
let spawnT = 2.2;
const floats = [];    // טקסטים צפים
const parts = [];     // חלקיקי אבק
let pickAcc = 0, dropAcc = 0, pickAcc2 = 0, dropAcc2 = 0, cashAcc = 0, serveAcc = 0;

const SHIRTS = ['#4a90d9','#d94a6a','#58b368','#e2a13c','#9b59b6','#3fb9a8','#d97c4a'];
function spawnCustomer(){
  if (customers.filter(c => c.state !== 'leave').length >= 6) return;
  const want = 1 + Math.floor(Math.random() * 3);
  customers.push({
    x: 790, y: 1090, want,
    shirt: SHIRTS[Math.floor(Math.random() * SHIRTS.length)],
    state: 'walk', slot: -1, sway: Math.random() * 6, hat: Math.random() < .3, patience: Math.max(23, 73 - (S.stage-1)*5 - (S.price-5)*2), maxPatience: Math.max(23, 73 - (S.stage-1)*5 - (S.price-5)*2),
  });
}
function assignSlots(){
  let i = 0;
  for (const c of customers) if (c.state === 'walk' || c.state === 'queue') c.slot = i++;
}

/* ---------------- קלט: ג'ויסטיק וירטואלי + מקלדת ---------------- */
const joy = { active: false, id: -1, ox: 0, oy: 0, dx: 0, dy: 0 };
const keys = {};
function toWorld(cx, cy){
  const r = cv.getBoundingClientRect();
  return { x: (cx - r.left) / scale, y: (cy - r.top) / scale };
}
cv.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  const p = toWorld(t.clientX, t.clientY);
  joy.active = true; joy.id = t.identifier; joy.ox = p.x; joy.oy = p.y; joy.dx = 0; joy.dy = 0;
}, { passive:false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === joy.id){
    const p = toWorld(t.clientX, t.clientY);
    let dx = p.x - joy.ox, dy = p.y - joy.oy;
    const d = Math.hypot(dx, dy), m = 90;
    if (d > m){ dx = dx / d * m; dy = dy / d * m; }
    joy.dx = dx / m; joy.dy = dy / m;
  }
}, { passive:false });
const endTouch = e => {
  for (const t of e.changedTouches) if (t.identifier === joy.id){
    joy.active = false; joy.dx = 0; joy.dy = 0;
  }
};
cv.addEventListener('touchend', endTouch);
cv.addEventListener('touchcancel', endTouch);
cv.addEventListener('mousedown', e => {
  const p = toWorld(e.clientX, e.clientY);
  joy.active = true; joy.id = 'm'; joy.ox = p.x; joy.oy = p.y; joy.dx = 0; joy.dy = 0;
});
window.addEventListener('mousemove', e => {
  if (!joy.active || joy.id !== 'm') return;
  const p = toWorld(e.clientX, e.clientY);
  let dx = p.x - joy.ox, dy = p.y - joy.oy;
  const d = Math.hypot(dx, dy), m = 90;
  if (d > m){ dx = dx / d * m; dy = dy / d * m; }
  joy.dx = dx / m; joy.dy = dy / m;
});
window.addEventListener('mouseup', () => { if (joy.id === 'm'){ joy.active = false; joy.dx = 0; joy.dy = 0; } });
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup',   e => { keys[e.key.toLowerCase()] = false; });

/* ---------------- עזרים ---------------- */
const dist   = (x1,y1,x2,y2) => Math.hypot(x2-x1, y2-y1);
const inRect = (px,py,r) => px > r.x && px < r.x + r.w && py > r.y && py < r.y + r.h;
const clamp  = (v,a,b) => Math.max(a, Math.min(b, v));
function addFloat(x, y, text, color){ floats.push({ x, y, text, color: color || '#fff', t: 0 }); }
function addDust(x, y){
  parts.push({ x, y, vx: (Math.random()-.5)*40, vy: -20 - Math.random()*30, t: 0, r: 3 + Math.random()*4 });
}
function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---------------- לולאת משחק ---------------- */
let last = performance.now();
function loop(now){
  let dt = (now - last) / 1000; last = now;
  dt = Math.min(dt, .05);
  S.t += dt;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function update(dt){
  /* תנועה */
  let mx = joy.dx, my = joy.dy;
  if (keys['arrowleft'] || keys['a']) mx -= 1;
  if (keys['arrowright']|| keys['d']) mx += 1;
  if (keys['arrowup']   || keys['w']) my -= 1;
  if (keys['arrowdown'] || keys['s']) my += 1;
  const ml = Math.hypot(mx, my);
  if (ml > 1){ mx /= ml; my /= ml; }
  player.moving = ml > .12;
  if (player.moving){
    player.x = clamp(player.x + mx * player.speed * dt, 30, W - 30);
    player.y = clamp(player.y + my * player.speed * dt, 120, H - 40);
    if (Math.abs(mx) > .1) player.face = mx > 0 ? 1 : -1;
    player.bob += dt * 11;
    if (Math.random() < dt * 9) addDust(player.x - player.face * 8, player.y + 26);
  } else {
    player.bob += dt * 2;
  }

  /* חומוס: צמיחה מחדש + איסוף */
  field.regrow += dt;
  if (field.regrow > .45 && field.peas < field.maxPeas){ field.peas++; field.regrow = 0; }
  if (inRect(player.x, player.y, field) && field.peas > 0 &&
      (player.carrying === null || player.carrying === 'pea') && player.carryN < S.capacity){
    pickAcc += dt;
    while (pickAcc > .09 && field.peas > 0 && player.carryN < S.capacity){
      pickAcc -= .09; field.peas--; player.carrying = 'pea'; player.carryN++;
      if (player.carryN % 3 === 0 || player.carryN === S.capacity) sndPick();
    }
  } else pickAcc = 0;

  /* מכונת טיגון: הפקדה, עיבוד, איסוף פלאפל */
  if (dist(player.x, player.y, machine.inPad.x, machine.inPad.y) < machine.inPad.r &&
      player.carrying === 'pea' && player.carryN > 0){
    dropAcc += dt;
    while (dropAcc > .07 && player.carryN > 0){
      dropAcc -= .07; player.carryN--; machine.input++; sndDrop();
    }
    if (player.carryN === 0) player.carrying = null;
  } else dropAcc = 0;

  if (S.cooldown > 0){
    S.cooldown = Math.max(0, S.cooldown - dt);
    S.heat = Math.max(0, S.heat - dt * .5);
  } else if (machine.input > 0){
    S.heat = Math.min(1, S.heat + dt * S.heatRate);
    if (S.heat >= 1){ S.cooldown = 3.2; S.notice = 'הטיגון מתחמם · רגע לקירור'; S.noticeT = 2; }
    machine.prog += dt;
    if (machine.prog >= S.processTime){
      machine.prog = 0; machine.input--; machine.output++;
    }
  } else { machine.prog = 0; S.heat = Math.max(0, S.heat - dt * .24); }

  if (dist(player.x, player.y, machine.outPad.x, machine.outPad.y) < machine.outPad.r &&
      machine.output > 0 && (player.carrying === null || player.carrying === 'falafel') && player.carryN < S.capacity){
    pickAcc2 += dt;
    while (pickAcc2 > .09 && machine.output > 0 && player.carryN < S.capacity){
      pickAcc2 -= .09; machine.output--; player.carrying = 'falafel'; player.carryN++;
      if (player.carryN % 3 === 0 || player.carryN === S.capacity) sndPick();
    }
  } else pickAcc2 = 0;

  /* דוכן: הפקדת פלאפל */
  if (dist(player.x, player.y, stall.dropPad.x, stall.dropPad.y) < stall.dropPad.r &&
      player.carrying === 'falafel' && player.carryN > 0){
    dropAcc2 += dt;
    while (dropAcc2 > .07 && player.carryN > 0){
      dropAcc2 -= .07; player.carryN--; stall.stock++; sndDrop();
    }
    if (player.carryN === 0) player.carrying = null;
  } else dropAcc2 = 0;

  /* איסוף כסף */
  if (dist(player.x, player.y, stall.moneyPad.x, stall.moneyPad.y) < stall.moneyPad.r && stall.moneyPile > 0){
    cashAcc += dt;
    if (cashAcc > .15){
      cashAcc = 0;
      addFloat(stall.moneyPad.x, stall.moneyPad.y - 40, '+₪' + stall.moneyPile, '#7dff9a');
      S.money += stall.moneyPile; S.earned += stall.moneyPile; stall.moneyPile = 0; sndCash();
      const next = stageGoal(S.stage);
      if (S.earned >= next){
        S.stage++; S.bonus = 22; S.notice = 'שלב ' + S.stage + ' נפתח · זמן בונוס!'; S.noticeT = 4;
        beep(1000,.15,'sine',.1);
      }
    }
  } else cashAcc = 0;

  /* לקוחות */
  spawnT -= dt;
  if (spawnT <= 0){
    spawnCustomer();
    const base = Math.max(1.45, 4.3 - (S.stage-1)*.38);
    spawnT = (base + Math.random()*.9) * (S.bonus > 0 ? .72 : 1);
  }
  S.bonus = Math.max(0, S.bonus - dt);
  S.noticeT = Math.max(0, S.noticeT - dt);
  assignSlots();
  for (const c of customers){
    c.sway += dt * 4;
    if (c.state === 'walk' || c.state === 'queue'){
      c.patience -= dt;
      if (c.patience <= 0){ c.state = 'leave'; S.missed++; addFloat(c.x,c.y-65,'הלך לקוח','#c85143'); continue; }
      const sl = queueSlots[Math.min(c.slot, queueSlots.length - 1)];
      const dx = sl.x - c.x, dy = sl.y - c.y, d = Math.hypot(dx, dy);
      if (d > 8){ c.x += dx / d * 150 * dt; c.y += dy / d * 150 * dt; c.state = 'walk'; }
      else c.state = 'queue';
    } else if (c.state === 'leave'){
      c.x += 170 * dt; c.y += 40 * dt;
    }
  }
  /* הגשה */
  const front = customers.find(c => c.state === 'queue' && c.slot === 0);
  if (front && stall.stock >= front.want){
    serveAcc += dt;
    if (serveAcc > .55){
      serveAcc = 0;
      stall.stock -= front.want;
      const pay = front.want * S.price * (S.bonus > 0 ? 2 : 1);
      S.served++;
      stall.moneyPile += pay;
      addFloat(front.x, front.y - 70, '+₪' + pay, '#ffe27a');
      front.state = 'leave'; sndSell();
    }
  } else serveAcc = 0;
  for (let i = customers.length - 1; i >= 0; i--)
    if (customers[i].x > W + 60) customers.splice(i, 1);

  /* שדרוגים */
  for (const u of upgrades){
    const cost = u.cost(u.level);
    const on = dist(player.x, player.y, u.x, u.y) < u.r;
    if (!on) u.armed = true;
    if (on && u.armed && S.money >= cost){
      u.holdT += dt;
      if (u.holdT >= .8){
        S.money -= cost; u.level++; u.holdT = 0; u.armed = false; u.apply();
        S.upgradesBought++;
        addFloat(u.x, u.y - 60, 'שודרג! ⭐', '#ffd94a'); sndBuy();
      }
    } else u.holdT = Math.max(0, u.holdT - dt * 2);
  }

  /* אפקטים */
  for (let i = floats.length - 1; i >= 0; i--){
    floats[i].t += dt; floats[i].y -= 42 * dt;
    if (floats[i].t > 1.3) floats.splice(i, 1);
  }
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.t > .6) parts.splice(i, 1);
  }

  /* המידע מתעדכן על גבי המגרש */
}

/* ---------------- ציור ---------------- */
function draw(){
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  drawZones();

  drawField();
  drawMachine();
  drawStall();
  drawUpgradePads();
  drawDashboard();

  /* ישויות לפי עומק */
  const ents = [];
  ents.push({ y: player.y, f: drawPlayer });
  for (const c of customers) ents.push({ y: c.y, f: () => drawCustomer(c) });
  ents.sort((a, b) => a.y - b.y).forEach(e => e.f());

  /* אבק */
  for (const p of parts){
    ctx.globalAlpha = 1 - p.t / .6;
    ctx.fillStyle = '#d9c39a';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* טקסטים צפים */
  ctx.textAlign = 'center';
  for (const f of floats){
    ctx.globalAlpha = 1 - f.t / 1.3;
    ctx.font = '900 26px Heebo, Arial';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.45)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  /* ג'ויסטיק */
  if (joy.active){
    ctx.globalAlpha = .28;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 62, 0, 7); ctx.fill();
    ctx.globalAlpha = .5;
    ctx.beginPath(); ctx.arc(joy.ox + joy.dx * 42, joy.oy + joy.dy * 42, 26, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function pad(p, color, label){
  ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = 14;
  ctx.setLineDash([9, 7]);
  ctx.strokeStyle = color; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.stroke();
  ctx.restore(); ctx.setLineDash([]);
  ctx.fillStyle = color + '22';
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  const k = label.indexOf('icon:') === 0 ? label.slice(5) : '';
  if (k === 'pea'){ icPea(p.x, p.y - 6, 1); icArrow(p.x, p.y + 28, .9, 1, color); }
  if (k === 'ball'){ icBall(p.x, p.y - 4, 1.1); icArrow(p.x, p.y + 28, .9, -1, color); }
  if (k === 'pita'){ icPita(p.x, p.y - 6, 1); icArrow(p.x, p.y + 28, .9, 1, color); }
}

function drawUpgradePads(){
  for (const u of upgrades){
    const cost = u.cost(u.level);
    const afford = S.money >= cost;
    ctx.save(); if (afford){ ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 24 + Math.sin(S.t * 5) * 6; }
    ctx.setLineDash([10, 8]);
    ctx.strokeStyle = afford ? '#ffd94a' : 'rgba(90,60,30,.5)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(u.x, u.y, u.r, 0, 7); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
    ctx.fillStyle = afford ? 'rgba(255,226,122,.28)' : 'rgba(120,90,50,.10)';
    ctx.beginPath(); ctx.arc(u.x, u.y, u.r, 0, 7); ctx.fill();
    /* טבעת התקדמות */
    if (u.holdT > 0){
      ctx.strokeStyle = '#ffd94a'; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.arc(u.x, u.y, u.r + 4, -Math.PI / 2, -Math.PI / 2 + (u.holdT / .8) * Math.PI * 2); ctx.stroke();
    }
    (u.key === 'cap' ? icBag : u.key === 'price' ? icTag : icFlame)(u.x, u.y - 14, 1.2);
    icCoin(u.x - 16, u.y + 20, .75);
    ctx.font = '900 17px Heebo, Arial'; ctx.textAlign = 'left';
    ctx.fillStyle = afford ? '#1f6f32' : 'rgba(90,60,30,.75)';
    ctx.fillText(cost, u.x - 4, u.y + 26);
    ctx.textAlign = 'center';
    pips(u.x - (Math.min(u.level, 5) - 1) * 6.5, u.y + 42, u.level, '#d99b48', 5);
  }
}

/* ---------------- דמויות בסגנון צעצוע ---------------- */
function hairOf(shirt){ const hs = ['#3b2414','#1f1a17','#7a4a21','#c98a3a','#8b2d1f','#e3b65b']; let h = 0; for (const ch of shirt) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return hs[h % hs.length]; }
function drawPerson(x, y, shirt, face, bob, hat, opts){
  opts = opts || {};
  const b = Math.sin(bob) * 3, sw = Math.sin(bob) * 5;
  shadowEl(x + 3, y + 30, 24, 9);
  /* רגליים */
  ctx.fillStyle = opts.pants || '#34495e';
  rr(x - 11, y + 12 + b, 9, 17, 4); ctx.fill(); rr(x + 2, y + 12 - b, 9, 17, 4); ctx.fill();

    for (let x = 439 + ((y / 30) % 2) * 30; x < 734; x += 60){ ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 30); ctx.stroke(); } }
  ctx.restore();

  /* פלאזת הדוכן */

  ctx.strokeStyle = 'rgba(190,150,80,.4)'; ctx.lineWidth = 3; rr(36, 812, 688, 372, 40); ctx.stroke();

  /* מים בפינה */
  ctx.save();
  ctx.beginPath(); ctx.moveTo(0, 1090); ctx.bezierCurveTo(90, 1085, 150, 1135, 168, 1180); ctx.bezierCurveTo(176, 1205, 190, 1225, 215, 1240); ctx.lineTo(0, 1240); ctx.closePath();
  ctx.fillStyle = '#9fe3ee'; ctx.fill(); ctx.clip();
  ctx.fillStyle = lgrad(1090, 1240, '#58cbe0', '#2d94c4'); ctx.fillRect(0, 1100, 240, 150);
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 3;
  for (let i = 0; i < 5; i++){ const wy = 1140 + i * 24 + Math.sin(S.t * 1.5 + i) * 3; ctx.beginPath(); ctx.moveTo(20 + i * 8, wy); ctx.quadraticCurveTo(50 + i * 8, wy - 6, 80 + i * 8, wy); ctx.stroke(); }
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 1090); ctx.bezierCurveTo(90, 1085, 150, 1135, 168, 1180); ctx.bezierCurveTo(176, 1205, 190, 1225, 215, 1240); ctx.stroke(); ctx.lineCap = 'butt';
  rockEl(120, 1118, .8); rockEl(168, 1196, .9); rockEl(30, 1080, .7);

  /* כותרת עליונה */
  ctx.fillStyle = 'rgba(25,55,30,.28)'; ctx.fillRect(0, 112, W, 10);

  ctx.fillStyle = '#e7c37b'; ctx.fillRect(0, 109, W, 4);

  /* קישוט: עצים, סלעים, שיחים בין האזורים */
  bushTree(392, 262, 1); bushTree(372, 470, .85); bushTree(418, 540, .7);
  rockEl(392, 168, .8);

  /* קציר: שלט שדה */

  ctx.strokeStyle = '#b8895a'; ctx.lineWidth = 4;

  ctx.fillStyle = '#d99b48'; ctx.beginPath(); ctx.arc(374, 545, 6, 0, 7); ctx.fill();

/* ---------------- שדה חומוס ---------------- */
function drawField(){
  /* גדר מאחור */
  ctx.fillStyle = '#76492a';
  for (let x = field.x - 8; x < field.x + field.w + 8; x += 34){ rr(x, field.y - 22, 8, 26, 3); ctx.fill(); }
  ctx.fillStyle = '#b57a45'; rr(field.x - 12, field.y - 14, field.w + 24, 8, 4); ctx.fill();
  /* אדמה מוגבהת */
  ext(field.x, field.y, field.w, field.h, 20, 16, '#b8834f', '#7a4f2d');
  ctx.fillStyle = '#9b6a3b';
  for (let i = 0; i < 8; i++){ rr(field.x + 14, field.y + 22 + i * 44, field.w - 28, 14, 7); ctx.fill(); }
  /* שיחי חומוס */
  const n = field.peas;
  for (let i = 0; i < n; i++){
    const bx = field.x + 30 + (i % 5) * 50, by = field.y + 40 + Math.floor(i / 5) * 44;
    shadowEl(bx + 4, by + 12, 18, 6);
    ctx.fillStyle = '#3f9a4b'; ctx.beginPath(); ctx.ellipse(bx - 9, by + 2, 11, 8, -.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bx + 9, by + 2, 11, 8, .5, 0, 7); ctx.fill();
    ctx.fillStyle = '#62bb5a'; ctx.beginPath(); ctx.ellipse(bx, by - 3, 14, 11, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#f6dc8a';
    ctx.beginPath(); ctx.arc(bx - 5, by - 6, 5.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(bx + 6, by - 4, 5.5, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(bx - 6.5, by - 8, 1.8, 0, 7); ctx.fill();
  }
  if (n === 0){ icSnow(field.x + field.w / 2, field.y + field.h / 2, 0); ctx.globalAlpha = .6; icPea(field.x + field.w / 2, field.y + field.h / 2, 1.6); ctx.globalAlpha = 1; }
  crateEl(field.x + field.w - 78, field.y + field.h + 12, 54, 30, true);
  crateEl(field.x + 10, field.y + field.h + 14, 44, 28, true);
}

/* ---------------- תחנת טיגון ---------------- */
function drawMachine(){
  const m = machine;
  /* ארובה + אדים */
  ext(m.x + m.w - 60, m.y - 18, 36, 70, 6, 8, '#c06a42', '#85472c');
  for (let i = 0; i < 4; i++){
    const ph = ((S.t * .5 + i * .25) % 1);
    ctx.globalAlpha = (1 - ph) * .7; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(m.x + m.w - 42 + Math.sin(S.t * 2 + i) * 6 + ph * 10, m.y - 14 - ph * 34, 9 + ph * 12, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  /* גוף לבנים */
  ext(m.x, m.y + 36, m.w, m.h - 36, 18, 14, PAL.terra, PAL.terraDk);
  ctx.save(); rr(m.x, m.y + 36, m.w, m.h - 36, 18); ctx.clip();
  ctx.strokeStyle = 'rgba(110,55,30,.28)'; ctx.lineWidth = 2;
  for (let y = m.y + 36; y < m.y + m.h; y += 18){ ctx.beginPath(); ctx.moveTo(m.x, y); ctx.lineTo(m.x + m.w, y); ctx.stroke();
    for (let x = m.x + ((y / 18) % 2) * 22; x < m.x + m.w; x += 44){ ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 18); ctx.stroke(); } }
  ctx.restore();
  /* מחבת שמן אליפטית */
  const cx = m.x + m.w / 2, cy = m.y + 70;
  shadowEl(cx + 4, cy + 20, 104, 36);
  ctx.fillStyle = '#2f343b'; ctx.beginPath(); ctx.ellipse(cx, cy + 6, 104, 40, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#4b525c'; ctx.beginPath(); ctx.ellipse(cx, cy, 104, 40, 0, 0, 7); ctx.fill();
  const og = ctx.createRadialGradient(cx - 20, cy - 10, 6, cx, cy, 90); og.addColorStop(0, '#ffd067'); og.addColorStop(1, '#e8962c');
  ctx.fillStyle = og; ctx.beginPath(); ctx.ellipse(cx, cy, 92, 33, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,245,200,.8)';
  for (let i = 0; i < 6; i++){ const bx = cx - 60 + i * 24, by = cy + Math.sin(S.t * 3 + i * 2) * 10; ctx.beginPath(); ctx.arc(bx, by, 3.5, 0, 7); ctx.fill(); }
  const fry = Math.min(machine.input + (machine.prog > 0 ? 1 : 0), 6);
  for (let i = 0; i < fry; i++){
    const bx = cx - 62 + i * 25, by = cy + (i % 2 ? 6 : -6);
    ctx.fillStyle = '#9a5b24'; ctx.beginPath(); ctx.arc(bx, by, 10, 0, 7); ctx.fill();
    ctx.fillStyle = '#c98a45'; ctx.beginPath(); ctx.arc(bx - 2, by - 3, 6, 0, 7); ctx.fill();
  }
  /* פס התקדמות */
  ctx.fillStyle = '#4b2a1a'; rr(m.x + 22, m.y + 112, m.w - 44, 16, 8); ctx.fill();
  ctx.fillStyle = '#ffc247';
  const pw = (m.w - 48) * (machine.input > 0 ? machine.prog / S.processTime : 0);
  if (pw > 2){ rr(m.x + 24, m.y + 114, pw, 12, 6); ctx.fill(); }
  if (S.cooldown > 0){ icSnow(m.x + m.w / 2, m.y + m.h - 18, 1); } else { pips(m.x + 24, m.y + m.h - 18, machine.input, '#f6dc8a', 8); pips(m.x + m.w - 24 - 12 * 13, m.y + m.h - 18, machine.output, '#9a5b24', 8); }
  ctx.fillStyle = '#4b2a1a'; rr(m.x + 22, m.y + 137, m.w - 44, 10, 5); ctx.fill();
  ctx.fillStyle = '#e8452e'; rr(m.x + 22, m.y + 139, (m.w - 44) * S.heat, 6, 3); ctx.fill();
  /* להבה קטנה */
  const fl = 1 + Math.sin(S.t * 9) * .12;
  ctx.fillStyle = '#ff8a1e'; ctx.beginPath(); ctx.moveTo(m.x + 30, m.y + 176); ctx.quadraticCurveTo(m.x + 20, m.y + 160, m.x + 30, m.y + 150 / fl + 10); ctx.quadraticCurveTo(m.x + 40, m.y + 162, m.x + 30, m.y + 176); ctx.fill();

  pad(machine.inPad, '#4a90d9', 'icon:pea');
  pad(machine.outPad, '#58b368', 'icon:ball');
  const on = Math.min(machine.output, 10);
  for (let i = 0; i < on; i++){
    const bx = machine.outPad.x - 22 + (i % 5) * 11, by = machine.outPad.y - 6 - Math.floor(i / 5) * 11;
    ctx.fillStyle = '#9a5b24'; ctx.beginPath(); ctx.arc(bx, by, 6.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#c98a45'; ctx.beginPath(); ctx.arc(bx - 1.5, by - 2, 3, 0, 7); ctx.fill();
  }
}

/* ---------------- דוכן ---------------- */
function drawStall(){
  const st = stall;
  /* עמודים */
  ctx.fillStyle = '#76492a'; rr(st.x - 8, st.y - 52, 10, 70, 3); ctx.fill(); rr(st.x + st.w - 2, st.y - 52, 10, 70, 3); ctx.fill();
  /* דלפק */
  ext(st.x, st.y, st.w, st.h, 12, 14, '#c58a52', '#7d4f2b');
  ctx.strokeStyle = 'rgba(100,60,30,.35)'; ctx.lineWidth = 2;
  for (let i = 1; i < 6; i++){ ctx.beginPath(); ctx.moveTo(st.x + i * st.w / 6, st.y + 40); ctx.lineTo(st.x + i * st.w / 6, st.y + st.h + 12); ctx.stroke(); }
  ctx.fillStyle = '#d9a46c'; rr(st.x + 6, st.y + 6, st.w - 12, 28, 8); ctx.fill();
  /* סוכך פסים */
  const aw = st.w + 36, sw = aw / 8, ay = st.y - 66;
  for (let i = 0; i < 8; i++){
    const sx = st.x - 18 + i * sw;
    ctx.fillStyle = i % 2 ? '#fff6e3' : '#1f9a8a';
    ctx.beginPath(); ctx.moveTo(sx, ay); ctx.lineTo(sx + sw, ay); ctx.lineTo(sx + sw, ay + 36); ctx.arc(sx + sw / 2, ay + 36, sw / 2, 0, Math.PI); ctx.lineTo(sx, ay + 36); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = 'rgba(25,55,30,.2)'; ctx.fillRect(st.x - 18, ay + 36, aw, 6);
  ctx.fillStyle = '#157a6d'; rr(st.x - 22, ay - 10, aw + 8, 14, 6); ctx.fill();
  /* שלט מעל הסוכך */
  ext(st.x + st.w / 2 - 88, ay + 6, 176, 28, 8, 4, '#c58a52', '#76492a');
  icCrown(st.x + st.w / 2, ay + 20, 1.2);

  icCoin(st.x + st.w / 2 - 26, st.y + 62, 1.3); ctx.fillStyle = '#fff8ea'; ctx.font = '900 26px Arial'; ctx.textAlign = 'left'; ctx.fillText(S.price, st.x + st.w / 2 - 6, st.y + 71); ctx.textAlign = 'center';

  const n = Math.min(stall.stock, 12);
  for (let i = 0; i < n; i++){
    const bx = st.x + 40 + (i % 6) * 26, by = st.y + 30 - Math.floor(i / 6) * 22;
    ctx.fillStyle = '#9a5b24'; ctx.beginPath(); ctx.arc(bx, by, 11, 0, 7); ctx.fill();
    ctx.fillStyle = '#c98a45'; ctx.beginPath(); ctx.arc(bx - 3, by - 3, 5, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#e8cf97'; ctx.beginPath(); ctx.ellipse(st.x + st.w - 70, st.y + 26, 30, 16, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#f6e3b4'; ctx.beginPath(); ctx.ellipse(st.x + st.w - 70, st.y + 21, 30, 15, 0, 0, 7); ctx.fill();
  drawServing(st.x + st.w - 70, st.y + 32, .85);
  pad(st.dropPad, '#d9483b', 'icon:pita');
  pad(st.moneyPad, '#d9a000', '');

  /* ערימת מטבעות */
  const mn = Math.min(Math.ceil(stall.moneyPile / 10), 8);
  for (let i = 0; i < mn; i++){
    const cy = stall.moneyPad.y - 4 - i * 7;
    ctx.fillStyle = '#b8860b'; ctx.beginPath(); ctx.ellipse(stall.moneyPad.x, cy + 4, 26, 9, 0, 0, 7); ctx.fill();
    ctx.fillStyle = PAL.coin; ctx.beginPath(); ctx.ellipse(stall.moneyPad.x, cy, 26, 9, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.beginPath(); ctx.ellipse(stall.moneyPad.x - 7, cy - 2, 9, 3, 0, 0, 7); ctx.fill();
  }
  if (stall.moneyPile > 0){
    icCoin(stall.moneyPad.x - 16, stall.moneyPad.y + 30, .7); ctx.fillStyle = '#7a5410'; ctx.font = '800 14px Heebo, Arial'; ctx.textAlign = 'left'; ctx.fillText(stall.moneyPile, stall.moneyPad.x - 4, stall.moneyPad.y + 35); ctx.textAlign = 'center';
  }
}

function drawServing(x,y,z){
  ctx.save();ctx.translate(x,y);ctx.scale(z,z);
  ctx.fillStyle='#ecce92';ctx.beginPath();ctx.ellipse(0,7,34,21,0,0,7);ctx.fill();
  ctx.fillStyle='#8a5030';for(const a of [-17,0,17]){ctx.beginPath();ctx.arc(a,0,9,0,7);ctx.fill();}
  ctx.fillStyle='#5ba958';for(const a of [-22,7,22]){ctx.beginPath();ctx.ellipse(a,-10,10,5,.3,0,7);ctx.fill();}
  ctx.strokeStyle='#f8f4d9';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-25,1);ctx.bezierCurveTo(-5,-13,5,17,26,-1);ctx.stroke();
  ctx.fillStyle='#d14934';ctx.beginPath();ctx.arc(0,-7,4,0,7);ctx.fill();ctx.restore();
}
/* שמירה מקומית אופציונלית; המשחק ממשיך גם כשהאחסון חסום */
const SAVE_KEY = 'falafel-king-progress-v2';
try {
  const old = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
  if (old && old.version === 2 && Number.isFinite(old.earned) && old.earned >= 0){
    S.money = clamp(old.money || 0, 0, 1e9);
    S.earned = clamp(old.earned, 0, 1e9);
    S.stage = clamp(Math.floor(old.stage || 1), 1, 20);
    S.served = clamp(old.served || 0, 0, 1e9);
    S.missed = clamp(old.missed || 0, 0, 1e9);
    if (Array.isArray(old.levels)) upgrades.forEach((u,i) => {
      const n = clamp(Math.floor(old.levels[i] || 0),0,20);
      for(let j=0;j<n;j++) u.apply();
      u.level=n;
    });
  }
} catch(e) { /* ללא אחסון, משחקים כרגיל */ }
setInterval(() => {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({
    version:2, money:S.money, earned:S.earned, stage:S.stage, served:S.served,
    missed:S.missed, levels:upgrades.map(u=>u.level)
  })); } catch(e) { /* אחסון חסום או מלא */ }
}, 5000);
requestAnimationFrame(loop);
</script>
